plugins {
    id 'com.android.application'
}

android {
    namespace 'com.normaker.nativefull'
    compileSdk 34

    defaultConfig {
        applicationId 'com.normaker.nativefull'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
