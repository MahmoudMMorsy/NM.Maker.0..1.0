name: CI Build and Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies and build frontend
      run: |
        npm install
        npm run build
      working-directory: Nor-maker-7-main

    - name: Run Native C Core Tests
      run: |
        mkdir -p /tmp/nor_core_tests
        gcc -o /tmp/nor_core_tests/test_suite \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/test_full_suite.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/gm82_gmk_reader.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/gml_frontend.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/gml_vm.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/nor_format_native.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/retro_rom_native.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/gm82_portable_compat.c \
          NorMaker-0_extracted/android_project_base/app/src/main/cpp/gm82_android_core.c \
          -DHOST_TEST_BUILD -I${JAVA_HOME}/include -I${JAVA_HOME}/include/linux -lz -lm
        /tmp/nor_core_tests/test_suite
